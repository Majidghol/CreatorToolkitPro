plugins {
    id 'com.android.application'
}

android {
    namespace "com.creatortoolkit.pro"
    compileSdk 34

    defaultConfig {
        applicationId "com.creatortoolkit.pro"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.0.0'


    implementation 'com.google.android.gms:play-services-ads:23.0.0'
}
